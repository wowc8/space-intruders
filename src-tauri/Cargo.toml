[package]
name = "space-intruders"
version = "0.1.0"
description = "Space Intruders desktop shell"
authors = ["Space Intruders"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "space_intruders_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }

# Rust 1.94's debuginfo stripping can produce proc-macro dylibs rejected by
# macOS 27 dyld (misaligned LINKEDIT string pool). Keep build artifacts intact.
[profile.release]
strip = "none"

[profile.release.build-override]
strip = "none"
